server {
    listen 80;
    server_name campus.example.com;
    root /var/www/html;
    index index.php;

    charset utf-8;
    client_max_body_size 25m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 内部目录不直接暴露：页面与接口统一经根 index.php 路由
    location ~ ^/(pages|api|lib|config|database|bin|scripts|tests|deploy|benchmark|var)/ {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # 页面入口已迁入 pages/，根目录不存在的 .php 请求回退到统一入口 index.php。
        # 注意：这一行不能用默认的 try_files $uri =404，否则 /p_*.php 会直接 404。
        try_files $uri /index.php?$query_string;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_read_timeout 60;
    }

    location ~* \.(css|js|png|jpe?g|gif|svg|webp|ico|woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
